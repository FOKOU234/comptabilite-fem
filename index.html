<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#110A0D">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lady Gaine"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Lady Gaine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Parti pris : application sombre façon terminal de trading, ébène et or, feux de signalisation lumineux, barre du bas à 5 onglets. Un seul look, assumé. */
:root{
  color-scheme:dark;
  --bg:#0A0910;--s1:#13111B;--s2:#1B1826;--s3:#262236;--line:#2C2840;--ink:#F5F0E8;--mute:#A097B1;
  --acc:#E3B65B;--acc2:#F6DCA0;--on-acc:#1A1204;--acc-soft:rgba(227,182,91,.14);--acc-glow:rgba(227,182,91,.38);
  --good:#35D6A0;--good-soft:rgba(53,214,160,.14);--bad:#FF5E78;--bad-soft:rgba(255,94,120,.14);--warn:#FFB547;--warn-soft:rgba(255,181,71,.14);
  --f-display:'Space Grotesk','Segoe UI',system-ui,sans-serif;--f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:18px;--rs:12px;
  --glass:linear-gradient(180deg,color-mix(in srgb,var(--s2) 84%,transparent),color-mix(in srgb,var(--s1) 80%,transparent));
}
:root[data-accent="gaine"]{--bg:#110A0D;--s1:#1A1014;--s2:#24151B;--s3:#321D25;--line:#3A2430;--ink:#F7EEE9;--mute:#B8A0A6;--acc:#D9A58F;--acc2:#F3CDBD;--on-acc:#2A0F16;--acc-soft:rgba(217,165,143,.14);--acc-glow:rgba(217,165,143,.38)}
:root[data-accent="rose"]{--acc:#F08DA8;--acc2:#FAC3D2;--on-acc:#2A0A14;--acc-soft:rgba(240,141,168,.15);--acc-glow:rgba(240,141,168,.38)}
:root[data-accent="violet"]{--acc:#9D8CFF;--acc2:#CFC6FF;--on-acc:#120C33;--acc-soft:rgba(157,140,255,.16);--acc-glow:rgba(157,140,255,.4)}
:root[data-accent="saphir"]{--acc:#5AA2FF;--acc2:#B5D4FF;--on-acc:#06142B;--acc-soft:rgba(90,162,255,.15);--acc-glow:rgba(90,162,255,.4)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px;min-height:100%}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:19px}
h3{font-size:11px;font-family:var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--mute);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
small{color:var(--mute)}
.ic{flex:none;display:block}
.good{color:var(--good)}.bad{color:var(--bad)}.warnc{color:var(--warn)}

/* Barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(color-mix(in srgb,var(--bg) 90%,transparent) 78%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 0 10px;display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:14px;display:block;box-shadow:0 10px 24px -8px var(--acc-glow)}
.tt{flex:1;min-width:0}
.tt b{display:block;white-space:nowrap;font:700 17px var(--f-display);letter-spacing:-.01em;background:linear-gradient(90deg,var(--ink),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tt span{display:block;font-size:12px;color:var(--mute);text-transform:capitalize}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--s1);display:grid;place-items:center;color:var(--mute)}
.ib[aria-current="true"]{color:var(--acc);border-color:var(--acc)}
.offline{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn);border-radius:99px;padding:3px 9px}
.strips{display:grid;gap:6px;padding-bottom:4px}
.strips:empty{display:none}
.strip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--bad);background:var(--bad-soft);color:var(--ink);border-radius:var(--rs);padding:9px 12px;font-size:13px;font-weight:700}
.strip.ok{border-color:var(--good);background:var(--good-soft)}
.strip i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 10px var(--bad)}
.strip.ok i{background:var(--good);box-shadow:0 0 10px var(--good)}

main{padding-top:10px;display:grid;gap:18px}
.sec{display:grid;gap:12px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lead{color:var(--mute);margin:0;font-size:14px;max-width:60ch}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}

/* Héros */
.hero{border-radius:22px;padding:18px;display:grid;gap:14px;min-width:0;border:1px solid color-mix(in srgb,var(--acc) 38%,var(--line));
  background:radial-gradient(120% 100% at 0% 0%,var(--acc-soft),transparent 60%),var(--glass);box-shadow:0 20px 50px -30px var(--acc-glow)}
.hero .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hero .lab{font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.04em}
.hero .big{font:700 clamp(36px,11vw,54px)/1.05 var(--f-display);letter-spacing:-.03em;overflow-wrap:anywhere}
.chip-d{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--s3);color:var(--mute)}
.chip-d.good{background:var(--good-soft);color:var(--good)}.chip-d.bad{background:var(--bad-soft);color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--s1)}
.seg button{border:0;background:none;padding:6px 13px;border-radius:99px;color:var(--mute);font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--on-acc);font-weight:700}
.spark{display:block;width:100%;height:84px}
.spark .sz{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.spark .sl{fill:none;stroke:var(--acc);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--rs);overflow:hidden}
.trio div{background:var(--s1);padding:10px 12px;display:grid;gap:2px;min-width:0}
.trio span{font-size:11px;color:var(--mute);font-weight:600}
.trio b{font:500 13.5px var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* Feux de signalisation */
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sig{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;min-width:0}
.sig .led{grid-row:span 2;width:12px;height:12px;border-radius:50%;background:var(--mute)}
.sig b{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.04em}
.sig em{font:600 17px var(--f-display);font-style:normal;grid-column:2}
.sig span{grid-column:1/-1;font-size:12px;color:var(--mute);padding-top:4px}
.led.good{background:var(--good);box-shadow:0 0 12px var(--good)}
.led.warn{background:var(--warn);box-shadow:0 0 12px var(--warn)}
.led.bad{background:var(--bad);box-shadow:0 0 12px var(--bad)}
.led.off{background:var(--s3)}

/* Alertes */
.alert{border:1.5px solid var(--line);border-radius:var(--r);background:var(--s1);padding:14px;display:grid;gap:9px}
.alert .t{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.alert .led{flex:none;width:11px;height:11px;border-radius:50%;margin-top:6px}
.alert p{margin:0;color:var(--mute);font-size:14px}
.alert.ok{border-color:var(--good);background:var(--good-soft)}
.alert.warn{border-color:var(--warn);background:var(--warn-soft)}
.alert.crit{border-color:var(--bad);background:var(--bad-soft)}
.alert.danger{border-style:dashed;border-width:2px}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:99px;background:var(--bad);color:#2b0710}
@keyframes alarm{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 60%,transparent)}50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--bad) 0%,transparent)}}
@keyframes blink{50%{opacity:.15}}
.flash{animation:alarm 1.1s ease-out infinite}
.led.flash,.strip.flash i{animation:blink .9s steps(2,jump-none) infinite}
@media (prefers-reduced-motion:reduce){.flash,.led.flash,.strip.flash i{animation:none}.flash{outline:3px solid var(--bad);outline-offset:2px}}

/* Objectif et risque */
.goal{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center}
.ring{width:112px;height:112px;display:block}
.ring .rt{fill:none;stroke:var(--s3);stroke-width:9}
.ring .rf{fill:none;stroke:var(--acc);stroke-width:9;stroke-linecap:round}
.ring.good .rf{stroke:var(--good)}.ring.warn .rf{stroke:var(--warn)}.ring.bad .rf{stroke:var(--bad)}
.ring .rv{fill:var(--ink);font:700 19px var(--f-display);text-anchor:middle}
.goal .nums{display:grid;gap:4px;min-width:0}
.goal .nums b{font:700 22px var(--f-mono);font-variant-numeric:tabular-nums}
.risk{position:relative;height:12px;margin-top:6px}
.risk .zones{position:absolute;inset:0;border-radius:99px;opacity:.85}
.risk .needle{position:absolute;top:-5px;width:4px;height:22px;margin-left:-2px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 3px var(--bg)}
.risk-l{position:relative;height:18px;font-size:12px;color:var(--mute)}
.risk-l span:last-child{position:absolute;transform:translateX(-50%);white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--s3);color:var(--ink)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.acc{background:var(--acc-soft);color:var(--acc2)}

/* Graphiques */
.chart svg{display:block;width:100%;height:auto;max-width:640px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--mute);font:11px var(--f-mono)}
.chart .ax.today{fill:var(--ink);font-weight:500}
.chart .be{fill:var(--acc)}.chart .bd{fill:var(--warn);opacity:.9}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--acc)}
.legend span.d::before{background:var(--warn)}
.bars{display:grid;gap:11px}
.bar .r{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.bar .r span:first-child{min-width:0;overflow-wrap:anywhere}
.bar i{display:block;height:7px;border-radius:99px;background:var(--s3);overflow:hidden;margin-top:4px}
.bar i b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.steps{display:grid;gap:12px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--on-acc);display:grid;place-items:center;font:700 13px var(--f-display)}

/* Boutons */
.btn{border:1px solid var(--line);background:var(--s2);border-radius:var(--rs);padding:11px 16px;font-weight:700;min-height:46px;font-size:15px}
.btn.primary{background:linear-gradient(135deg,var(--acc2),var(--acc));border-color:transparent;color:var(--on-acc);box-shadow:0 10px 26px -10px var(--acc-glow)}
.btn.danger{background:var(--bad);border-color:transparent;color:#2b0710}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--acc);padding:2px 0;font-weight:700;font-size:13px}
.link:hover{text-decoration:underline}
.btns{display:grid;gap:10px}

/* Listes */
.day{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:16px 2px 4px;flex-wrap:wrap}
.day b{font:700 14px var(--f-display)}
.day small{font:12px var(--f-mono)}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.av{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc2)}
.av.w{background:var(--warn-soft);color:var(--warn)}
.item .main{min-width:0}
.item .ttl{font-weight:700;overflow-wrap:anywhere}
.item .meta{font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
.item .amt{text-align:right;font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .amt small{display:block;font-size:11.5px}
.item .acts{grid-column:1/-1;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-top:6px;border-top:1px dashed var(--line);margin-top:6px}
.item.void .ttl,.item.void .amt{text-decoration:line-through;color:var(--mute)}
.item select{min-height:34px;font-size:13px;padding:4px 28px 4px 10px;width:auto;border-radius:99px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--s1)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:150px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);font-weight:700}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--f-body);font-weight:700}
tfoot td{font-weight:500;border-bottom:0;color:var(--acc2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--s1);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc2);border-color:var(--acc)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--mute)}

/* Navigation du bas */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:0 max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px));pointer-events:none}
.dock-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:6px;border-radius:22px;background:color-mix(in srgb,var(--s1) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 18px 40px -12px rgba(0,0,0,.7);pointer-events:auto}
.nb{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:7px 2px 6px;border-radius:16px;color:var(--mute);font-size:10.5px;font-weight:700;min-width:0}
.nb[aria-current="true"]{color:var(--acc);background:var(--acc-soft)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:36;width:56px;height:56px;border-radius:19px;border:0;color:var(--on-acc);background:linear-gradient(135deg,var(--acc2),var(--acc));box-shadow:0 14px 30px -8px var(--acc-glow);display:grid;place-items:center}

/* Formulaires */
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--s1);border:1px solid var(--line);border-radius:var(--rs);padding:11px 13px;width:100%;min-height:48px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
input[readonly]{color:var(--mute)}
textarea{min-height:84px;resize:vertical}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.fld{display:grid;gap:5px;min-width:0}
.fld label{font-size:12.5px;font-weight:700;color:var(--mute)}
.fld small{font-size:12px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.form{display:grid;gap:18px}
.grp{display:grid;gap:12px;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cg{display:flex;gap:7px;flex-wrap:wrap}
.ch{border:1px solid var(--line);background:var(--s1);border-radius:12px;padding:9px 13px;font-size:14px;font-weight:600;color:var(--mute);min-height:42px}
.ch[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc2)}
.arts{display:grid;gap:8px}
.artc{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:var(--rs);padding:12px 14px}
.artc b{font-weight:700;overflow-wrap:anywhere}
.artc span{font:500 13px var(--f-mono);color:var(--mute);white-space:nowrap}
.artc small{grid-column:1/-1}
.artc[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.artc:disabled{opacity:.45;cursor:default}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:stretch}
.stepper button{border:1px solid var(--line);background:var(--s1);border-radius:var(--rs);font:600 24px var(--f-display);min-height:48px}
.stepper input{text-align:center;font:600 20px var(--f-mono)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border-radius:var(--rs);overflow:hidden}
.calc div{background:var(--s1);padding:10px 12px;display:grid;gap:2px;min-width:0}
.calc span{font-size:11.5px;color:var(--mute);font-weight:600}
.calc b{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.msg{font-size:14px;border-radius:var(--rs);padding:11px 13px;background:var(--warn-soft);border:1px solid var(--warn)}
.msg.bad{background:var(--bad-soft);border-color:var(--bad)}
.msg:empty{display:none}
.sheet{position:fixed;inset:0;z-index:50;overflow:auto;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.sheet .in{max-width:620px;margin:0 auto;display:grid;gap:16px;padding-bottom:20px}
.sh-hd{display:flex;align-items:center;gap:12px;padding:10px 0;position:sticky;top:0;background:var(--bg);z-index:3}
.sh-hd h2{font-size:20px;flex:1;min-width:0}
.back{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--s1);color:var(--ink)}

/* ===== Mise à jour fluidité & modernité ===== */
html{-webkit-text-size-adjust:100%}
button,a,.item,tr[data-act],[data-act]{touch-action:manipulation}
button,.item,.atile,.at,.at2,.nb,.chip,.btn,.clot{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .25s,border-color .25s,box-shadow .25s,opacity .2s}
button:active,.item[data-act]:active,tr[data-act]:active{transform:scale(.97)}
.btn:active,.at:active,.at2:active,.atile:active,.clot:active{transform:scale(.97)}
@media (hover:hover){.btn:hover,.at:hover,.at2:hover{transform:translateY(-1px)}}

/* entrée des écrans */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes sheetIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes sheen{0%{background-position:-160% 0}100%{background-position:260% 0}}
#app.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#app.enter>*:nth-child(1){animation-delay:0s}#app.enter>*:nth-child(2){animation-delay:.05s}#app.enter>*:nth-child(3){animation-delay:.1s}
#app.enter>*:nth-child(4){animation-delay:.15s}#app.enter>*:nth-child(5){animation-delay:.2s}#app.enter>*:nth-child(6){animation-delay:.24s}
#app.enter>*:nth-child(7){animation-delay:.28s}#app.enter>*:nth-child(n+8){animation-delay:.32s}
#app.enter .bars i b,#app.enter .prog i,#app.enter .gbar i b,#app.enter .rtrack i,#app.enter .chg i b,#app.enter .ptrack i{transform-origin:left center;animation:grow .8s cubic-bezier(.2,.8,.2,1) .15s both}
#app.enter .cbig,#app.enter .trio b,#app.enter .c3 b{animation:fadein .7s .1s both}
.sheet:not([hidden]){animation:sheetIn .32s cubic-bezier(.2,.8,.2,1)}
.sheet{overscroll-behavior:contain}
.toast:not([hidden]){animation:toastIn .32s cubic-bezier(.2,.8,.2,1)}

/* ---------- utilitaires ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var nf=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
function N(n){return nf.format(Math.round(n||0))}
function F(n){return N(n)+' F'}
function sgn(n){return (n>0?'+':'')+N(n)+' F'}
function pct(x){return (Math.round(x*1000)/10).toString().replace('.',',')+' %'}
function pad(n){return String(n).padStart(2,'0')}
function pad4(n){return String(n).padStart(4,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayS(){return ymd(new Date())}
function addDays(s,n){var p=s.split('-').map(Number);return ymd(new Date(p[0],p[1]-1,p[2]+n))}
function fdate(s){if(!s)return '';var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}
function fdateL(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function fshort(s){if(!s)return '';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function nextN(list,prefix){var m=0;list.forEach(function(x){if(x.no&&x.no.indexOf(prefix)===0){var n=parseInt(x.no.slice(prefix.length),10);if(n>m)m=n}});return m+1}
function nextNo(list,prefix){return prefix+pad4(nextN(list,prefix))}
function ymPrefix(date){return date.slice(2,4)+date.slice(5,7)}
function num(id){var e=$('#'+id);return e?(parseFloat(e.value)||0):0}
function val(id){var e=$('#'+id);return e?String(e.value||'').trim():''}
function setT(id,t){var e=$('#'+id);if(e)e.textContent=t}
function setH(id,h){var e=$('#'+id);if(e)e.innerHTML=h}
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},4200)}

function bump(){S.ver++}
function normCfg(c){var o=Object.assign({},DEF,c||{});if((+o.facMig||0)<3){o.facMig=3;o.facStyle='moderne'}if((+o.rulesV||0)<3){o.rulesV=3;o.stockMin=9;if(o.goalU==='fcfa'&&(+o.goal===2500||!o.goal)){o.goalU='pieces';o.goal=10}}if(['fcfa','ventes','pieces'].indexOf(o.goalU)<0)o.goalU='fcfa';return o}
function lsLoad(){try{var j=JSON.parse(localStorage.getItem(LS)||'null');if(j&&j.data){S.data=Object.assign(S.data,j.data);S.cfg=normCfg(j.cfg);bump()}}catch(e){}
  try{var l=JSON.parse(localStorage.getItem(LAST_LS)||'null');if(l)Object.assign(S.last,l)}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({data:S.data,cfg:S.cfg}))}catch(e){}}
function saveLast(){try{localStorage.setItem(LAST_LS,JSON.stringify(S.last))}catch(e){}}
function clean(o){return JSON.parse(JSON.stringify(o))}
function put(col,obj){
  obj.id=obj.id||uid();var o=clean(obj);
  if(S.db)return S.db.collection(col).doc(o.id).set(o).then(function(){return o});
  S.data[col]=S.data[col].filter(function(x){return x.id!==o.id});S.data[col].push(o);bump();lsSave();render();return Promise.resolve(o)}
function patch(col,id,p){
  if(S.db)return S.db.doc(col+'/'+id).update(clean(p));

  var prixNet=legacy?(+l.pa||0):(+l.prixNet||0),transport=legacy?(+l.frais||0):(+l.transport||0);

var STATUTS=[['aconfirmer','À confirmer'],['confirmee','Confirmée'],['livraison','En livraison'],['suspendue','Suspendue'],['livree','Livrée'],['retour','Retour'],['annulee','Annulée']];

function ordDead(c){return !!c&&(c.statut==='retour'||c.statut==='annulee')}
function statLabel(k){var x=STATUTS.filter(function(y){return y[0]===k})[0];return x?x[1]:k}
function saleOk(v){if(v.void||v.statut==='retour'||v.statut==='annule')return false;return !ordDead(ordMap()[v.no])}
function ordTotals(c){
  var L=S.data.ventes.filter(function(v){return v.no===c.no&&!v.void}),t=0,q=0;L.forEach(function(v){t+=v.prix*v.qte;q+=v.qte});
  var fc=+((c.liv||{}).fclient)||0,tot=t+fc,av=+((c.pay||{}).avance)||0;
  return {lines:L,art:t,qte:q,fc:fc,total:tot,avance:av,reste:Math.max(0,tot-av)}}
function cashIn(upTo){
  var c=0,ok=function(d){return !upTo||d<=upTo};
  S.data.commandes.forEach(function(o){if(o.void)return;var T=ordTotals(o);
    if(T.avance>0&&!(ordDead(o)&&o.rembourse)&&ok(o.date))c+=T.avance;
    if(o.statut==='livree'){var e=o.encaisse!=null?+o.encaisse:T.reste;if(ok(o.livreeLe||o.date))c+=e}});
  return c}
function toCollect(){var t=0;S.data.commandes.forEach(function(o){if(!o.void&&(o.statut==='aconfirmer'||o.statut==='confirmee'||o.statut==='livraison'||o.statut==='suspendue'))t+=ordTotals(o).reste});return t}
function ordOpen(){return S.data.commandes.filter(function(o){return !o.void&&(o.statut==='aconfirmer'||o.statut==='confirmee'||o.statut==='livraison'||o.statut==='suspendue')})}
function ordLate(){var t=todayS();return ordOpen().filter(function(o){return o.statut!=='suspendue'&&o.liv&&o.liv.prevue&&o.liv.prevue<t})}

function livSince(c){if(c.livraisonAt)return c.livraisonAt;var h=(c.hist||[]).filter(function(x){return x.statut==='livraison'});return h.length?h[h.length-1].at:(c.createdAt||Date.now())}
function ordPending(){return S.data.commandes.filter(function(o){return !o.void&&o.statut==='aconfirmer'})}
function ordSusp(){return S.data.commandes.filter(function(o){return !o.void&&o.statut==='suspendue'})}
function ordStuck(){var lim=(+S.cfg.livMin||90)*60000,n=Date.now();return S.data.commandes.filter(function(o){return !o.void&&o.statut==='livraison'&&n-livSince(o)>=lim}).sort(function(a,b){return livSince(a)-livSince(b)})}
function durTxt(ms){var m=Math.max(0,Math.floor(ms/60000)),h=Math.floor(m/60);return h?h+' h '+pad(m%60)+' min':m+' min'}
function ordAlerts(){
  var out=[],P=ordPending(),mx=+S.cfg.pendMax||4,t=todayS(),n=Date.now();
  if(P.length>=mx)out.push({k:'pend',t:P.length+' commandes attendent d\'être confirmées',p:'Seuil : '+mx+'. Plus une commande attend, plus tu risques de perdre la cliente. Appelle-les maintenant : confirme ou annule chacune.',act:'goventes',f:'aconfirmer',btn:'Voir les commandes à confirmer'});

function M(){
  if(S.cache&&S.cache.v===S.ver)return S.cache;
  var today=todayS(),lots=[],byKey={},byId={};
  S.data.lots.forEach(function(l){if(!l.void)lots.push(mkLot(l,false))});
  S.data.arrivages.forEach(function(a){if(!a.void)lots.push(mkLot(a,true))});
  lots.sort(function(a,b){return a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0)});
  lots.forEach(function(l){
    var vs=(l.variantes||[]).filter(function(v){return +v.pieces>0});
    l.modele=l.nom;
    l.units=vs.length?vs.map(function(v){return {parent:l,sub:true,modele:l.nom,taille:v.taille,couleur:v.couleur,key:varKey(l.nom,v.taille,v.couleur),pieces:+v.pieces,vendus:0,ca:0,nbV:0,rev:{},coutUnit:l.coutUnit,no:l.no,soldOut:'',date:l.date,prixVente:l.prixVente}}):[l]});
  lots.forEach(function(l){l.units.forEach(function(u){(byKey[u.key]=byKey[u.key]||[]).push(u)})});
  lots.forEach(function(l){byId[l.id]=l;l.vendus=l.dejaVendu;l.ca=l.dejaEncaisse;l.rev={};l.dep=0;l.nbV=0;l.soldOut=''});
  var sales=S.data.ventes.filter(saleOk).sort(function(a,b){return a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0)||String(a.no).localeCompare(String(b.no))}).map(function(v){return Object.assign({},v)});
  sales.forEach(function(v){
    var arr=byKey[v.key]||[],left=v.qte,cost=0,nos=[];
    function take(l,q){l.vendus+=q;l.ca+=q*v.prix;l.nbV++;cost+=q*l.coutUnit;l.rev[v.date]=(l.rev[v.date]||0)+q*v.prix;if(nos.indexOf(l.no)<0)nos.push(l.no);if(l.vendus>=l.pieces&&v.date>l.soldOut)l.soldOut=v.date}
    for(var i=0;i<arr.length&&left>0;i++){var cap=arr[i].pieces-arr[i].vendus;if(cap<=0)continue;var q=Math.min(cap,left);take(arr[i],q);left-=q}
    if(left>0){if(arr.length)take(arr[arr.length-1],left);else cost+=left*(v.cout||0)}
    v.coutTot=cost;v.benef=v.prix*v.qte-cost;v.lotNos=nos});
  lots.forEach(function(l){if(l.units[0]===l)return;
    l.vendus=l.dejaVendu;l.ca=l.dejaEncaisse;l.nbV=0;l.rev={};
    l.units.forEach(function(u){l.vendus+=u.vendus;l.ca+=u.ca;l.nbV+=u.nbV;Object.keys(u.rev).forEach(function(d){l.rev[d]=(l.rev[d]||0)+u.rev[d]});if(u.soldOut&&u.soldOut>l.soldOut)l.soldOut=u.soldOut})});
  var regs=S.data.reglements.filter(function(r){return !r.void});
  lots.forEach(function(l){
    l.paye=regs.filter(function(r){return r.lotId===l.id}).reduce(function(s,r){return s+r.montant},0);
    l.reste=Math.max(0,l.credit-l.paye);l.restant=l.pieces-l.vendus;
    l.coutVendu=l.vendus*l.coutUnit;l.marge=l.ca-l.coutVendu;
    l.prevu=l.pieces*(l.prixVente-l.coutUnit);l.potentiel=Math.max(0,l.restant)*(l.prixVente-l.coutUnit);
    if(l.units[0]!==l&&l.restant>0)l.soldOut='';
    if(!l.soldOut&&l.restant<=0)l.soldOut=l.date;
    l.end=l.soldOut||(l.restant>0?today:l.date)});
  var unalloc=0;
  S.data.depenses.forEach(function(d){
    if(d.void)return;var cand=[],w=0;
    lots.forEach(function(l){var r=l.rev[d.date];if(r){cand.push([l,r]);w+=r}});
    if(!cand.length)lots.forEach(function(l){if(l.pieces>0&&l.date<=d.date&&d.date<=l.end){cand.push([l,l.pieces]);w+=l.pieces}});
    if(!cand.length){unalloc+=d.montant;return}
    cand.forEach(function(c){c[0].dep+=d.montant*c[1]/w})});
  lots.forEach(function(l){l.net=l.marge-l.dep});
  var am={};
  lots.forEach(function(l){l.units.forEach(function(u){
    var rest=u.pieces-u.vendus;
    var a=am[u.key]||(am[u.key]={key:u.key,modele:l.nom,taille:u.taille||'',couleur:u.couleur||'',nom:varLabel(l.nom,u.taille,u.couleur),cat:l.cat||'',recu:0,vendu:0,restant:0,valeur:0,prix:0,pmin:0,last:''});
    a.recu+=u.pieces;a.vendu+=u.vendus;a.restant+=rest;a.valeur+=Math.max(0,rest)*u.coutUnit;
    if(l.date>=a.last){a.last=l.date;a.prix=l.prixVente;a.pmin=+l.prixMin||0;a.nom=varLabel(l.nom,u.taille,u.couleur)}})});
  var arts=Object.keys(am).map(function(k){var a=am[k];a.coutMoy=a.restant>0?a.valeur/a.restant:0;a.valVente=Math.max(0,a.restant)*a.prix;a.benefPot=a.valVente-a.valeur;return a}).sort(function(a,b){return a.nom.localeCompare(b.nom,'fr')});
  var mm={};
  arts.forEach(function(a){var k=a.modele.trim().toLowerCase(),o=mm[k]||(mm[k]={key:k,nom:a.modele,cat:a.cat,recu:0,vendu:0,restant:0,valeur:0,valVente:0,benefPot:0,prix:a.prix,variants:[]});
    o.recu+=a.recu;o.vendu+=a.vendu;o.restant+=a.restant;o.valeur+=a.valeur;o.valVente+=a.valVente;o.benefPot+=a.benefPot;o.prix=a.prix;o.variants.push(a)});
  var models=Object.keys(mm).map(function(k){return mm[k]}).sort(function(a,b){return a.nom.localeCompare(b.nom,'fr')}),modelBy={};models.forEach(function(x){modelBy[x.key]=x});
  var artBy={};arts.forEach(function(a){artBy[a.key]=a});
  S.cache={v:S.ver,lots:lots,lotById:byId,sales:sales,arts:arts,artBy:artBy,models:models,modelBy:modelBy,unalloc:unalloc,regs:regs};
  return S.cache}
function varKey(nom,t,c){return (nom||'').trim().toLowerCase()+'|'+(t||'')+'|'+(c||'')}
function varLabel(nom,t,c){return nom+(t?' · '+t:'')+(c?' · '+c:'')}
function lotLabel(l){return l.nom+(l.nFac?' · '+l.nFac:'')}
function previewCost(key,q){
  var arr=[],left=q,c=0;M().lots.forEach(function(l){l.units.forEach(function(u){if(u.key===key)arr.push(u)})});
  for(var i=0;i<arr.length&&left>0;i++){var cap=arr[i].pieces-arr[i].vendus;if(cap<=0)continue;var t=Math.min(cap,left);c+=t*arr[i].coutUnit;left-=t}
  if(left>0&&arr.length)c+=left*arr[arr.length-1].coutUnit;
  return c}
function inR(d,f,t){return d>=f&&d<=t}
function agg(from,to){
  var m=M(),o={entrees:0,benef:0,pieces:0,nb:0,dep:0,cats:{},investi:0,achats:0,regl:0,cout:0},inv={};
  m.sales.forEach(function(v){if(inR(v.date,from,to)){o.entrees+=v.prix*v.qte;o.benef+=v.benef;o.cout+=v.coutTot;o.pieces+=v.qte;inv[v.no]=1}});
  o.nb=Object.keys(inv).length;
  S.data.depenses.forEach(function(d){if(!d.void&&inR(d.date,from,to)){o.dep+=d.montant;o.cats[d.cat]=(o.cats[d.cat]||0)+d.montant}});
  m.lots.forEach(function(l){if(!l.ancien&&inR(l.date,from,to)){o.investi+=l.coutTotal;o.achats+=l.coutTotal-l.credit}});
  m.regs.forEach(function(r){if(!r.histo&&inR(r.date,from,to))o.regl+=r.montant});
  o.net=o.benef-o.dep;o.ratio=o.entrees>0?o.dep/o.entrees:(o.dep>0?9.99:0);
  return o}
function caisse(upTo){
  var m=M(),c=+S.cfg.fond||0,ok=function(d){return !upTo||d<=upTo};
  m.sales.forEach(function(v){if(!ordMap()[v.no]&&ok(v.date))c+=v.prix*v.qte});c+=cashIn(upTo);
  S.data.depenses.forEach(function(d){if(!d.void&&ok(d.date))c-=d.montant});
  m.lots.forEach(function(l){if(!l.ancien&&ok(l.date))c-=(l.coutTotal-l.credit)});
  m.regs.forEach(function(r){if(!r.histo&&ok(r.date))c-=r.montant});
  return c}

function closureOf(date){var l=S.data.clotures.filter(function(c){return c.date===date&&!c.void}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});return l[0]||null}
function activeDays(){var o={};M().sales.forEach(function(v){o[v.date]=1});S.data.depenses.forEach(function(d){if(!d.void)o[d.date]=1});return o}

function soonCredits(){var t=todayS(),lim=addDays(t,3);return credits().list.filter(function(l){return l.reste>0&&l.echeance&&l.echeance>=t&&l.echeance<=lim}).sort(function(a,b){return a.echeance.localeCompare(b.echeance)})}
function daysLate(e){return Math.max(1,Math.round((new Date(todayS())-new Date(e))/864e5))}

function per(p){
  var t=todayS(),y=t.slice(0,4),mo=+t.slice(5,7),q=Math.floor((mo-1)/3);
  if(p==='jour')return {p:p,from:t,to:t,label:'Aujourd\'hui',ref:t};
  if(p==='semaine')return {p:p,from:addDays(t,-6),to:t,label:'7 derniers jours',ref:'*'};
  if(p==='mois')return {p:p,from:t.slice(0,8)+'01',to:t,label:'Ce mois',ref:t.slice(0,7)};
  if(p==='trimestre')return {p:p,from:y+'-'+pad(q*3+1)+'-01',to:t,label:'Ce trimestre',ref:y+'-T'+(q+1)};
  if(p==='annee')return {p:p,from:y+'-01-01',to:t,label:'Cette année',ref:y};
  if(p==='manuel')return {p:p,from:S.bfrom||t,to:S.bto||t,label:'Période choisie',ref:'m'};
  return {p:'tout',from:'2000-01-01',to:t,label:'Depuis le début',ref:'all'}}
function latestJustif(p,ref){
  var l=S.data.justifs.filter(function(j){return j.p===p&&(ref==='*'||j.ref===ref)}).sort(function(a,b){return b.at-a.at});return l[0]||null}
/* état d'une période : ok, wait (pas encore de vente), flash (alerte rouge clignotante), danger (justifiée, reste en zone de danger) */
function riskOf(p){
  var pr=per(p),a=agg(pr.from,pr.to),thr=S.cfg.seuil/100,r=a.ratio,o={p:p,pr:pr,a:a,r:r,thr:thr};
  if(a.dep<=0&&a.entrees<=0){o.state='wait';o.why='Rien enregistré';return o}
  if(a.entrees<=0&&p==='jour'&&a.dep<=S.cfg.bigExpense){o.state='wait';o.why='Pas encore de vente';return o}
  var over=a.entrees>0?a.dep/a.entrees>thr:a.dep>0;
  if(!over){o.state='ok';o.joy=(a.entrees>0&&r<=thr/2)?'super':'good';return o}
  var j=latestJustif(p,pr.ref);o.j=j;
  if(!j){o.state='flash';o.why='none';return o}
  var days=(Date.now()-j.at)/86400000;
  if(days>=30&&Math.min(9.99,r)>=j.ratio){o.state='flash';o.why='expired';return o}
  o.state='danger';o.left=Math.max(0,Math.ceil(30-days));return o}
function risks(){return PERS.map(function(x){return riskOf(x[0])})}

  return {cur:cur,target:t,ratio:r,cls:lv[0],label:lv[1],unit:UNITS[u]}}

function barsOf(o,none){

  if(!k.length)return '<small>'+none+'</small>';
  var mx=Math.max.apply(null,k.map(function(x){return Math.abs(o[x])}));
  return '<div class="bars">'+k.map(function(x){return '<div class="bar"><div class="r"><span>'+esc(x)+'</span><span class="num">'+F(o[x])+'</span></div><i><b style="width:'+Math.max(2,Math.abs(o[x])/mx*100)+'%"></b></i></div>'}).join('')+'</div>'}
function niceMax(v){var p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function short(v){return v>=1e6?(Math.round(v/1e5)/10)+'M':v>=1000?(Math.round(v/100)/10)+'k':String(Math.round(v))}

  var W=380,H=210,L=40,R=6,T=10,B=26,iw=W-L-R,ih=H-T-B,bw=iw/14,g='';

  days.forEach(function(x,k){
    var cx=L+bw*k+bw/2,eh=ih*x.e/mx,dh=ih*x.d/mx,w=Math.min(10,bw*.4);
    g+='<rect class="be" x="'+(cx-w-1)+'" y="'+(T+ih-eh)+'" width="'+w+'" height="'+eh+'" rx="2.5"/><rect class="bd" x="'+(cx+1)+'" y="'+(T+ih-dh)+'" width="'+w+'" height="'+dh+'" rx="2.5"/>'
      +'<text class="ax'+(k===13?' today':'')+'" x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+x.s.slice(8)+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ventes et dépenses des 14 derniers jours">'+g+'</svg>'}

function signals(){

function journal(){
  var L=[];
  [['lots',false],['arrivages',true]].forEach(function(cg){S.data[cg[0]].forEach(function(x){var l=mkLot(x,cg[1]);
    var out=l.ancien?0:l.coutTotal-l.credit;
    L.push({k:'arr',date:l.date,ts:l.createdAt||0,ref:l.no,t:l.ancien?'Ancien arrivage':'Arrivage',label:lotLabel(l)+' · '+l.pieces+' pcs'+(l.credit?' · crédit '+N(l.credit)+' F':''),amt:x.void?0:-out,v:!!x.void,id:x.id,col:cg[0]})})});
  S.data.reglements.forEach(function(r){var l=M().lotById[r.lotId];L.push({k:'cred',date:r.date,ts:r.createdAt||0,ref:r.no,t:'Crédit payé',label:(l?lotLabel(l):'Arrivage')+(r.mode?' · '+r.mode:'')+(r.note?' · '+r.note:''),amt:r.histo?0:-r.montant,v:!!r.void,id:r.id,col:'reglements'})});
  S.data.ventes.forEach(function(v){L.push({k:'vente',date:v.date,ts:v.createdAt||0,ref:v.no,t:'Vente',label:v.article+' × '+v.qte+(v.lieu?' · '+v.lieu:''),amt:(saleOk(v)&&!ordMap()[v.no])?v.prix*v.qte:0,v:!saleOk(v),id:v.id,col:'ventes'})});
  S.data.commandes.forEach(function(o){if(o.void)return;var T=ordTotals(o),cl=(o.client||{}).nom||'Cliente';
    if(T.avance>0)L.push({k:'enc',date:o.date,ts:(o.createdAt||0)+1,ref:o.no,t:'Avance reçue',label:cl+' · '+((o.pay||{}).moyen||'Cash'),amt:T.avance,v:false,id:o.id,col:'commandes'});
    if(o.statut==='livree')L.push({k:'enc',date:o.livreeLe||o.date,ts:(o.createdAt||0)+2,ref:o.no,t:'Livraison encaissée',label:cl+' · '+((o.liv||{}).livreur||'Boutique'),amt:o.encaisse!=null?+o.encaisse:T.reste,v:false,id:o.id,col:'commandes'});
    if(ordDead(o)&&o.rembourse&&T.avance>0)L.push({k:'enc',date:o.finLe||o.date,ts:(o.createdAt||0)+3,ref:o.no,t:'Avance remboursée',label:cl,amt:-T.avance,v:false,id:o.id,col:'commandes'})});
  S.data.depenses.forEach(function(d){L.push({k:'dep',date:d.date,ts:d.createdAt||0,ref:d.no,t:'Dépense',label:d.cat+(d.libelle&&d.libelle!==d.cat?' · '+d.libelle:''),amt:d.void?0:-d.montant,v:!!d.void,id:d.id,col:'depenses'})});
  S.data.justifs.forEach(function(j){L.push({k:'just',date:ymd(new Date(j.at)),ts:j.at,ref:'JUS',t:'Justification',label:perLabel(j.p)+' : '+j.text,amt:0,v:false,id:j.id,col:'justifs'})});
  S.data.clotures.forEach(function(c){L.push({k:'clot',date:c.date,ts:c.createdAt||0,ref:c.no,t:'Clôture',label:'Compté '+N(c.compte)+' F · attendu '+N(c.attendu)+' F · '+(c.ecart===0?'caisse exacte':'écart '+(c.ecart>0?'+':'')+N(c.ecart)+' F')+(c.why?' · '+c.why:''),amt:0,v:!!c.void,id:c.id,col:'clotures'})});
  L.sort(function(a,b){return a.date.localeCompare(b.date)||a.ts-b.ts});
  var bal=+S.cfg.fond||0;L.forEach(function(e){bal+=e.amt;e.bal=bal});
  return L.reverse()}

function stPill(k){var IC={aconfirmer:'phone',confirmee:'check',livraison:'truck',suspendue:'pause',livree:'box',retour:'undo',annulee:'x'};var c=k==='livree'?'good':(k==='retour'||k==='annulee'||k==='suspendue')?'bad':k==='livraison'?'acc':'warn';return pill(c,ic(IC[k]||'check',14)+' '+statLabel(k))}

  var f=S.cf,q=(S.cq||'').toLowerCase().trim(),L=S.data.commandes.filter(function(c){return !c.void}).filter(function(c){

    if(!q)return true;var cl=c.client||{};return (c.no+' '+cl.nom+' '+cl.tel+' '+cl.ville+' '+cl.quartier+' '+((c.liv||{}).livreur||'')).toLowerCase().indexOf(q)>=0})
    .sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
  if(!L.length)return '<div class="empty">'+(S.data.commandes.length?'Aucune commande ne correspond.':'Aucune commande pour l\'instant. Touche « Nouvelle commande » pour enregistrer ta première vente avec la cliente et la livraison.')+'</div>';
  var t=todayS();

    var T=ordTotals(c),cl=c.client||{},lv=c.liv||{},late=!ordDead(c)&&c.statut!=='livree'&&lv.prevue&&lv.prevue<t;
    return '<div class="item cmd" data-act="cmd" data-no="'+esc(c.no)+'"><div class="av">'+ic(c.statut==='livree'?'check':'sale')+'</div><div class="main"><div class="ttl">'+esc(cl.nom||'Cliente')+' <small class="mono">'+esc(c.no)+'</small></div>'
     +'<div class="meta">'+esc((cl.quartier?cl.quartier+', ':'')+(cl.ville||''))+' · '+T.qte+' pièce'+(T.qte>1?'s':'')+(c.statut!=='livree'&&!ordDead(c)&&lv.prevue&&lv.mode!=='Retrait en boutique'?' · <span class="'+(late?'bad':'')+'">livraison '+esc(fshort(lv.prevue))+(late?' (en retard)':'')+'</span>':'')+'</div><div class="meta">'+stPill(c.statut)+'</div></div>'
     +'<div class="amt">'+F(T.total)+'<small class="'+(ordDead(c)||c.statut==='livree'||T.reste<=0?'':'warnc')+'">'+(ordDead(c)?'—':c.statut==='livree'?'encaissé':'reste '+F(T.reste))+'</small></div></div>'}).join('')+'</div>'}

function saveArr(){

    credit:d.cred,creditStatut:d.cred>0?(isOld?'impaye':d.cstat):'',echeance:d.cred>0&&(isOld||d.cstat==='impaye')?d.due:'',ancien:isOld,dejaVendu:isOld?d.vendu:0,dejaEncaisse:isOld?d.enc:0,note:isOld?'Ancien stock repris':why,createdAt:Date.now()};
  jobs.push(put('lots',doc));
  if(!isOld&&d.cred>0){var pay=d.cstat==='paye'?d.cred:Math.min(d.ac,d.cred);
    if(pay>0)jobs.push(put('reglements',{no:nextNo(S.data.reglements,'RGL-'),date:date,lotId:doc.id,montant:pay,mode:'Cash',note:d.cstat==='paye'?'Crédit réglé à l\'arrivée':'Acompte à l\'arrivée',createdAt:Date.now()+1}))}
  closeSheet();S.tab='arrivages';S.seg='lots';S.anim=1;render();window.scrollTo(0,0);
  toast('Enregistré : '+(isOld?'ancien stock ':'arrivage ')+no+' · '+d.pieces+' pièces, '+d.vars.length+' tailles/couleurs.');

function editRows(){
  var c=ordMap()[S.sheet.no],T=ordTotals(c),out=[];
  T.lines.forEach(function(v,i){var key=val('el-a'+i),a=M().artBy[key],q=Math.round(num('el-q'+i)),p=num('el-p'+i),unit=(v.qte?(v.prix*v.qte-(v.benefice||0))/v.qte:0);
    var cost=!a?0:(key===v.key?unit*q:previewCost(key,q));
    out.push({v:v,i:i,key:key,a:a,q:q,p:p,total:p*q,ben:p*q-cost,col:val('el-c'+i)})});
  return out}
function editCCalc(){var R=editRows(),Q=0,T=0,B=0;R.forEach(function(r){Q+=r.q;T+=r.total;B+=r.ben});ordCalc(Q,T,B)}
function saveEditCmd(){
  var no=S.sheet.no,c=ordMap()[no];if(!c)return;var R=editRows(),why=val('ec-why'),date=c.date;
  var need={};
  for(var k=0;k<R.length;k++){var r=R[k];
    if(!r.a)return showErr('Choisis l\'article '+(k+1)+'.');
    if(r.q<1)return showErr('Article '+(k+1)+' : indique au moins 1 pièce.');
    if(r.p<=0)return showErr('Article '+(k+1)+' : indique le prix vendu.');
    need[r.key]=(need[r.key]||0)+r.q}
  for(var key in need){var a=M().artBy[key],had=R.filter(function(r){return r.v.key===key}).reduce(function(s,r){return s+r.v.qte},0);
    if(need[key]>a.restant+had)return showErr('Il ne reste que '+(a.restant+had)+' pièce'+((a.restant+had)>1?'s':'')+' de « '+a.nom+' ».')}
  var O=readOrd(date,R);if(O.err)return showErr(O.err);
  if(why.length<5)return showErr('Écris pourquoi tu modifies cette commande (au moins quelques mots).');
  if(c.statut==='livree'&&c.ecartEnc)return showErr('Cette commande a un écart d\'encaissement déjà noté. Annule-le ou contacte le suivi avant de la modifier.');
  var nc=O.c,ch=[];

  ch=ch.concat(histo(c.liv||{},nc.liv,{mode:'livraison',livreur:'livreur',prevue:'date prévue',heure:'heure',frais:'frais livreur',fclient:'livraison facturée',note:'note'}));
  ch=ch.concat(histo(c.pay||{},nc.pay,{mode:'paiement',avance:'avance',moyen:'reçu par',ref:'réf.'}));
  R.forEach(function(r){var v=r.v,d=histo(v,{key:r.key,qte:r.q,prix:r.p,couleurCli:r.col},{key:'article',qte:'pièces',prix:'prix',couleurCli:'couleur cliente'});if(d.length)ch.push('Article '+(r.i+1)+' ('+r.a.nom+') : '+d.join(', '))});

  R.forEach(function(r){T+=r.total;
    jobs.push(patch('ventes',r.v.id,{key:r.key,article:r.a.nom,qte:r.q,prix:r.p,benefice:Math.round(r.ben),couleurCli:r.col.slice(0,30),lieu:O.lieu,client:nc.client.nom,paiement:O.pm}))});

  jobs.push(cmdPatch(c,p,'Modifiée ('+why+') : '+ch.join(' · ')));
  Promise.all(jobs).catch(fail);
  closeSheet();toast('Commande '+no+' modifiée. Touche « Générer la facture » pour la version corrigée.');
  setTimeout(function(){sheetCmd(no)},250)}

/* ---------- annulation ---------- */
function sheetVoid(col,id){
  var o=S.data[col].filter(function(x){return x.id===id})[0];if(!o)return;
  var label,l=null;
  if(col==='lots'||col==='arrivages'){l=M().lotById[id];label=(o.nom||'')+' · '+(l?l.pieces:'')+' pièces'}
  else if(col==='ventes')label=o.article+' × '+o.qte+' · '+F(o.prix*o.qte);
  else if(col==='reglements')label='Paiement de crédit · '+F(o.montant);
  else label=o.cat+' · '+(o.libelle||'')+' · '+F(o.montant);
  if(l&&l.nbV>0){openSheet(shHead('Annuler un arrivage',o.no)+'<div class="grp"><b>'+esc(label)+'</b></div><p class="lead">Cet arrivage a déjà des ventes ('+l.nbV+'). Annule d\'abord ces ventes si tu veux vraiment l\'annuler.</p>','x');return}
  openSheet(shHead('Annuler une écriture',o.no||'')+'<div id="err" class="msg" role="alert"></div><form id="f" class="form" novalidate><div class="grp"><b>'+esc(label)+'</b><small>'+esc(fdate(o.date))+'</small></div>'
   +'<p class="lead">L\'écriture ne disparaît pas : elle reste barrée dans le journal avec ta raison, et tous les totaux sont recalculés sans elle.</p>'
   +fld('v-why','Raison de l\'annulation','<textarea id="v-why" placeholder="Ex. erreur de saisie, client a annulé"></textarea>')
   +'<button class="btn danger" type="submit">Annuler cette écriture</button></form>','void');
  S.sheet.col=col;S.sheet.rid=id}
function saveVoid(){
  var w=val('v-why');if(w.length<3)return showErr('Écris la raison de l\'annulation.');
  var col=S.sheet.col,id=S.sheet.rid;
  patch(col,id,{void:true,voidReason:w,voidAt:Date.now()}).then(function(){toast('Écriture annulée.')}).catch(fail);closeSheet();render()}

/* ---------- exports et sauvegardes ---------- */
function csvOf(rows){return '﻿'+rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')}).join('\n')}
function saveFile(name,data,mime){
  if(S.dl)return S.dl.save({filename:name,data:data});
  try{var u=URL.createObjectURL(new Blob([data],{type:mime||'text/plain'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);return Promise.resolve({status:'saved'})}catch(e){return Promise.reject(e)}}
