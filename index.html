<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0910">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compta Fem"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Comptabilité Fem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Parti pris : application sombre façon terminal de trading, ébène et or, feux de signalisation lumineux, barre du bas à 5 onglets. Un seul look, assumé. */
:root{
  color-scheme:dark;
  --bg:#0A0910;--s1:#13111B;--s2:#1B1826;--s3:#262236;--line:#2C2840;--ink:#F5F0E8;--mute:#A097B1;
  --acc:#E3B65B;--acc2:#F6DCA0;--on-acc:#1A1204;--acc-soft:rgba(227,182,91,.14);--acc-glow:rgba(227,182,91,.38);
  --good:#35D6A0;--good-soft:rgba(53,214,160,.14);--bad:#FF5E78;--bad-soft:rgba(255,94,120,.14);--warn:#FFB547;--warn-soft:rgba(255,181,71,.14);
  --f-display:'Sora','Segoe UI',system-ui,sans-serif;--f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:18px;--rs:12px;
  --glass:linear-gradient(180deg,color-mix(in srgb,var(--s2) 84%,transparent),color-mix(in srgb,var(--s1) 80%,transparent));
}
:root[data-accent="rose"]{--acc:#F08DA8;--acc2:#FAC3D2;--on-acc:#2A0A14;--acc-soft:rgba(240,141,168,.15);--acc-glow:rgba(240,141,168,.38)}
:root[data-accent="violet"]{--acc:#9D8CFF;--acc2:#CFC6FF;--on-acc:#120C33;--acc-soft:rgba(157,140,255,.16);--acc-glow:rgba(157,140,255,.4)}
:root[data-accent="saphir"]{--acc:#5AA2FF;--acc2:#B5D4FF;--on-acc:#06142B;--acc-soft:rgba(90,162,255,.15);--acc-glow:rgba(90,162,255,.4)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px;min-height:100%}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:19px}
h3{font-size:11px;font-family:var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--mute);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
small{color:var(--mute)}
.ic{flex:none;display:block}
.good{color:var(--good)}.bad{color:var(--bad)}.warnc{color:var(--warn)}

/* Barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(color-mix(in srgb,var(--bg) 90%,transparent) 78%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 0 10px;display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:14px;display:block;box-shadow:0 10px 24px -8px var(--acc-glow)}
.tt{flex:1;min-width:0}
.tt b{display:block;white-space:nowrap;font:700 17px var(--f-display);letter-spacing:-.01em;background:linear-gradient(90deg,var(--ink),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tt span{display:block;font-size:12px;color:var(--mute);text-transform:capitalize}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--s1);display:grid;place-items:center;color:var(--mute)}
.ib[aria-current="true"]{color:var(--acc);border-color:var(--acc)}
.offline{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn);border-radius:99px;padding:3px 9px}
.strips{display:grid;gap:6px;padding-bottom:4px}
.strips:empty{display:none}
.strip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--bad);background:var(--bad-soft);color:var(--ink);border-radius:var(--rs);padding:9px 12px;font-size:13px;font-weight:700}
.strip.ok{border-color:var(--good);background:var(--good-soft)}
.strip i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 10px var(--bad)}
.strip.ok i{background:var(--good);box-shadow:0 0 10px var(--good)}

main{padding-top:10px;display:grid;gap:18px}
.sec{display:grid;gap:12px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lead{color:var(--mute);margin:0;font-size:14px;max-width:60ch}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}

/* Héros */
.hero{border-radius:22px;padding:18px;display:grid;gap:14px;min-width:0;border:1px solid color-mix(in srgb,var(--acc) 38%,var(--line));
  background:radial-gradient(120% 100% at 0% 0%,var(--acc-soft),transparent 60%),var(--glass);box-shadow:0 20px 50px -30px var(--acc-glow)}
.hero .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hero .lab{font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.04em}
.hero .big{font:700 clamp(36px,11vw,54px)/1.05 var(--f-display);letter-spacing:-.03em;overflow-wrap:anywhere}
.chip-d{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--s3);color:var(--mute)}
.chip-d.good{background:var(--good-soft);color:var(--good)}.chip-d.bad{background:var(--bad-soft);color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--s1)}
.seg button{border:0;background:none;padding:6px 13px;border-radius:99px;color:var(--mute);font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--on-acc);font-weight:700}
.spark{display:block;width:100%;height:84px}
.spark .sz{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.spark .sl{fill:none;stroke:var(--acc);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--rs);overflow:hidden}
.trio div{background:var(--s1);padding:10px 12px;display:grid;gap:2px;min-width:0}
.trio span{font-size:11px;color:var(--mute);font-weight:600}
.trio b{font:500 13.5px var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* Feux de signalisation */
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sig{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;min-width:0}
.sig .led{grid-row:span 2;width:12px;height:12px;border-radius:50%;background:var(--mute)}
.sig b{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.04em}
.sig em{font:600 17px var(--f-display);font-style:normal;grid-column:2}
.sig span{grid-column:1/-1;font-size:12px;color:var(--mute);padding-top:4px}
.led.good{background:var(--good);box-shadow:0 0 12px var(--good)}
.led.warn{background:var(--warn);box-shadow:0 0 12px var(--warn)}
.led.bad{background:var(--bad);box-shadow:0 0 12px var(--bad)}
.led.off{background:var(--s3)}

/* Alertes */
.alert{border:1.5px solid var(--line);border-radius:var(--r);background:var(--s1);padding:14px;display:grid;gap:9px}
.alert .t{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.alert .led{flex:none;width:11px;height:11px;border-radius:50%;margin-top:6px}
.alert p{margin:0;color:var(--mute);font-size:14px}
.alert.ok{border-color:var(--good);background:var(--good-soft)}
.alert.warn{border-color:var(--warn);background:var(--warn-soft)}
.alert.crit{border-color:var(--bad);background:var(--bad-soft)}
.alert.danger{border-style:dashed;border-width:2px}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:99px;background:var(--bad);color:#2b0710}
@keyframes alarm{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 60%,transparent)}50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--bad) 0%,transparent)}}
@keyframes blink{50%{opacity:.15}}
.flash{animation:alarm 1.1s ease-out infinite}
.led.flash,.strip.flash i{animation:blink .9s steps(2,jump-none) infinite}
@media (prefers-reduced-motion:reduce){.flash,.led.flash,.strip.flash i{animation:none}.flash{outline:3px solid var(--bad);outline-offset:2px}}

/* Objectif et risque */
.goal{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center}
.ring{width:112px;height:112px;display:block}
.ring .rt{fill:none;stroke:var(--s3);stroke-width:9}
.ring .rf{fill:none;stroke:var(--acc);stroke-width:9;stroke-linecap:round}
.ring.good .rf{stroke:var(--good)}.ring.warn .rf{stroke:var(--warn)}.ring.bad .rf{stroke:var(--bad)}
.ring .rv{fill:var(--ink);font:700 19px var(--f-display);text-anchor:middle}
.goal .nums{display:grid;gap:4px;min-width:0}
.goal .nums b{font:700 22px var(--f-mono);font-variant-numeric:tabular-nums}
.risk{position:relative;height:12px;margin-top:6px}
.risk .zones{position:absolute;inset:0;border-radius:99px;opacity:.85}
.risk .needle{position:absolute;top:-5px;width:4px;height:22px;margin-left:-2px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 3px var(--bg)}
.risk-l{position:relative;height:18px;font-size:12px;color:var(--mute)}
.risk-l span:last-child{position:absolute;transform:translateX(-50%);white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--s3);color:var(--ink)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.acc{background:var(--acc-soft);color:var(--acc2)}

/* Graphiques */
.chart svg{display:block;width:100%;height:auto;max-width:640px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--mute);font:11px var(--f-mono)}
.chart .ax.today{fill:var(--ink);font-weight:500}
.chart .be{fill:var(--acc)}.chart .bd{fill:var(--warn);opacity:.9}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--acc)}
.legend span.d::before{background:var(--warn)}
.bars{display:grid;gap:11px}
.bar .r{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.bar .r span:first-child{min-width:0;overflow-wrap:anywhere}
.bar i{display:block;height:7px;border-radius:99px;background:var(--s3);overflow:hidden;margin-top:4px}
.bar i b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.steps{display:grid;gap:12px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--on-acc);display:grid;place-items:center;font:700 13px var(--f-display)}

/* Boutons */
.btn{border:1px solid var(--line);background:var(--s2);border-radius:var(--rs);padding:11px 16px;font-weight:700;min-height:46px;font-size:15px}
.btn.primary{background:linear-gradient(135deg,var(--acc2),var(--acc));border-color:transparent;color:var(--on-acc);box-shadow:0 10px 26px -10px var(--acc-glow)}
.btn.danger{background:var(--bad);border-color:transparent;color:#2b0710}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--acc);padding:2px 0;font-weight:700;font-size:13px}
.link:hover{text-decoration:underline}
.btns{display:grid;gap:10px}

/* Listes */
.day{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:16px 2px 4px;flex-wrap:wrap}
.day b{font:700 14px var(--f-display)}
.day small{font:12px var(--f-mono)}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.av{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc2)}
.av.w{background:var(--warn-soft);color:var(--warn)}
.item .main{min-width:0}
.item .ttl{font-weight:700;overflow-wrap:anywhere}
.item .meta{font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
.item .amt{text-align:right;font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .amt small{display:block;font-size:11.5px}
.item .acts{grid-column:1/-1;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-top:6px;border-top:1px dashed var(--line);margin-top:6px}
.item.void .ttl,.item.void .amt{text-decoration:line-through;color:var(--mute)}
.item select{min-height:34px;font-size:13px;padding:4px 28px 4px 10px;width:auto;border-radius:99px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--s1)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:150px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);font-weight:700}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--f-body);font-weight:700}
tfoot td{font-weight:500;border-bottom:0;color:var(--acc2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--s1);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc2);border-color:var(--acc)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--mute)}

/* Navigation du bas */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:0 max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px));pointer-events:none}
.dock-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:6px;border-radius:22px;background:color-mix(in srgb,var(--s1) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 18px 40px -12px rgba(0,0,0,.7);pointer-events:auto}
.nb{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:7px 2px 6px;border-radius:16px;color:var(--mute);font-size:10.5px;font-weight:700;min-width:0}
.nb[aria-current="true"]{color:var(--acc);background:var(--acc-soft)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:36;width:56px;height:56px;border-radius:19px;border:0;color:var(--on-acc);background:linear-gradient(135deg,var(--acc2),var(--acc));box-shadow:0 14px 30px -8px var(--acc-glow);display:grid;place-items:center}

/* Formulaires */
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--s1);border:1px solid var(--line);border-radius:var(--rs);padding:11px 13px;width:100%;min-height:48px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
input[readonly]{color:var(--mute)}
textarea{min-height:84px;resize:vertical}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.fld{display:grid;gap:5px;min-width:0}
.fld label{font-size:12.5px;font-weight:700;color:var(--mute)}
.fld small{font-size:12px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.form{display:grid;gap:18px}
.grp{display:grid;gap:12px;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cg{display:flex;gap:7px;flex-wrap:wrap}
.ch{border:1px solid var(--line);background:var(--s1);border-radius:12px;padding:9px 13px;font-size:14px;font-weight:600;color:var(--mute);min-height:42px}
.ch[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc2)}
.arts{display:grid;gap:8px}
.artc{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:var(--rs);padding:12px 14px}
.artc b{font-weight:700;overflow-wrap:anywhere}
.artc span{font:500 13px var(--f-mono);color:var(--mute);white-space:nowrap}
.artc small{grid-column:1/-1}
.artc[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.artc:disabled{opacity:.45;cursor:default}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:stretch}
.stepper button{border:1px solid var(--line);background:var(--s1);border-radius:var(--rs);font:600 24px var(--f-display);min-height:48px}
.stepper input{text-align:center;font:600 20px var(--f-mono)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border-radius:var(--rs);overflow:hidden}
.calc div{background:var(--s1);padding:10px 12px;display:grid;gap:2px;min-width:0}
.calc span{font-size:11.5px;color:var(--mute);font-weight:600}
.calc b{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.msg{font-size:14px;border-radius:var(--rs);padding:11px 13px;background:var(--warn-soft);border:1px solid var(--warn)}
.msg.bad{background:var(--bad-soft);border-color:var(--bad)}
.msg:empty{display:none}
.sheet{position:fixed;inset:0;z-index:50;overflow:auto;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.sheet .in{max-width:620px;margin:0 auto;display:grid;gap:16px;padding-bottom:20px}
.sh-hd{display:flex;align-items:center;gap:12px;padding:10px 0;position:sticky;top:0;background:var(--bg);z-index:3}
.sh-hd h2{font-size:20px;flex:1;min-width:0}
.back{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--s1);color:var(--ink)}
.actbar{position:sticky;bottom:0;z-index:3;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 22%);display:grid;gap:8px}
.actrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.sum{display:grid;min-width:0}
.sum small{font-size:11.5px}
.sum b{font:700 20px var(--f-display);overflow-wrap:anywhere}
.quick{display:grid;gap:10px}

    pieces:pieces,prixNet:prixNet,transport:transport,coutTotal:coutTotal,coutUnit:pieces?coutTotal/pieces:0,prixVente:+l.prixVente||0,
    credit:legacy?0:(+l.credit||0),ancien:!legacy&&!!l.ancien,dejaVendu:legacy?0:(+l.dejaVendu||0),dejaEncaisse:legacy?0:(+l.dejaEncaisse||0),nFac:l.nFac||''})}

function M(){
  if(S.cache&&S.cache.v===S.ver)return S.cache;

  S.data.lots.forEach(function(l){if(!l.void)lots.push(mkLot(l,false))});
  S.data.arrivages.forEach(function(a){if(!a.void)lots.push(mkLot(a,true))});
  lots.sort(function(a,b){return a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0)});
  lots.forEach(function(l){(byKey[l.key]=byKey[l.key]||[]).push(l);byId[l.id]=l;l.vendus=l.dejaVendu;l.ca=l.dejaEncaisse;l.rev={};l.dep=0;l.nbV=0;l.soldOut=''});

  sales.forEach(function(v){
    var arr=byKey[v.key]||[],left=v.qte,cost=0,nos=[];
    function take(l,q){l.vendus+=q;l.ca+=q*v.prix;l.nbV++;cost+=q*l.coutUnit;l.rev[v.date]=(l.rev[v.date]||0)+q*v.prix;if(nos.indexOf(l.no)<0)nos.push(l.no);if(l.vendus>=l.pieces&&v.date>l.soldOut)l.soldOut=v.date}
    for(var i=0;i<arr.length&&left>0;i++){var cap=arr[i].pieces-arr[i].vendus;if(cap<=0)continue;var q=Math.min(cap,left);take(arr[i],q);left-=q}
    if(left>0){if(arr.length)take(arr[arr.length-1],left);else cost+=left*(v.cout||0)}
    v.coutTot=cost;v.benef=v.prix*v.qte-cost;v.lotNos=nos});
  var regs=S.data.reglements.filter(function(r){return !r.void});
  lots.forEach(function(l){
    l.paye=regs.filter(function(r){return r.lotId===l.id}).reduce(function(s,r){return s+r.montant},0);
    l.reste=Math.max(0,l.credit-l.paye);l.restant=l.pieces-l.vendus;
    l.coutVendu=l.vendus*l.coutUnit;l.marge=l.ca-l.coutVendu;
    l.prevu=l.pieces*(l.prixVente-l.coutUnit);l.potentiel=Math.max(0,l.restant)*(l.prixVente-l.coutUnit);
    if(!l.soldOut&&l.restant<=0)l.soldOut=l.date;
    l.end=l.soldOut||(l.restant>0?today:l.date)});
  var unalloc=0;
  S.data.depenses.forEach(function(d){
    if(d.void)return;var cand=[],w=0;
    lots.forEach(function(l){var r=l.rev[d.date];if(r){cand.push([l,r]);w+=r}});
    if(!cand.length)lots.forEach(function(l){if(l.pieces>0&&l.date<=d.date&&d.date<=l.end){cand.push([l,l.pieces]);w+=l.pieces}});
    if(!cand.length){unalloc+=d.montant;return}
    cand.forEach(function(c){c[0].dep+=d.montant*c[1]/w})});
  lots.forEach(function(l){l.net=l.marge-l.dep});
  var am={};
  lots.forEach(function(l){
    var a=am[l.key]||(am[l.key]={key:l.key,nom:l.nom,recu:0,vendu:0,restant:0,valeur:0,prix:0,last:''});
    a.recu+=l.pieces;a.vendu+=l.vendus;a.restant+=l.restant;a.valeur+=Math.max(0,l.restant)*l.coutUnit;

  var artBy={};arts.forEach(function(a){artBy[a.key]=a});
  S.cache={v:S.ver,lots:lots,lotById:byId,sales:sales,arts:arts,artBy:artBy,unalloc:unalloc,regs:regs};
  return S.cache}

function per(p){
  var t=todayS(),y=t.slice(0,4),mo=+t.slice(5,7),q=Math.floor((mo-1)/3);

  var l=S.data.justifs.filter(function(j){return j.p===p&&(ref==='*'||j.ref===ref)}).sort(function(a,b){return b.at-a.at});return l[0]||null}
/* état d'une période : ok, wait (pas encore de vente), flash (alerte rouge clignotante), danger (justifiée, reste en zone de danger) */
function riskOf(p){
  var pr=per(p),a=agg(pr.from,pr.to),thr=S.cfg.seuil/100,r=a.ratio,o={p:p,pr:pr,a:a,r:r,thr:thr};
  if(a.dep<=0&&a.entrees<=0){o.state='wait';o.why='Rien enregistré';return o}
  if(a.entrees<=0&&p==='jour'&&a.dep<=S.cfg.bigExpense){o.state='wait';o.why='Pas encore de vente';return o}
  var over=a.entrees>0?a.dep/a.entrees>thr:a.dep>0;
  if(!over){o.state='ok';o.joy=(a.entrees>0&&r<=thr/2)?'super':'good';return o}
  var j=latestJustif(p,pr.ref);o.j=j;
  if(!j){o.state='flash';o.why='none';return o}
  var days=(Date.now()-j.at)/86400000;
  if(days>=30&&Math.min(9.99,r)>=j.ratio){o.state='flash';o.why='expired';return o}

/* ---------- briques ---------- */
function barsOf(o,none){
  var k=Object.keys(o).filter(function(x){return o[x]!==0}).sort(function(a,b){return o[b]-o[a]}).slice(0,8);
  if(!k.length)return '<small>'+none+'</small>';
  var mx=Math.max.apply(null,k.map(function(x){return Math.abs(o[x])}));
  return '<div class="bars">'+k.map(function(x){return '<div class="bar"><div class="r"><span>'+esc(x)+'</span><span class="num">'+F(o[x])+'</span></div><i><b style="width:'+Math.max(2,Math.abs(o[x])/mx*100)+'%"></b></i></div>'}).join('')+'</div>'}
function niceMax(v){var p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function short(v){return v>=1e6?(Math.round(v/1e5)/10)+'M':v>=1000?(Math.round(v/100)/10)+'k':String(Math.round(v))}
function chart(){
  var t=todayS(),days=[],i;
  for(i=13;i>=0;i--){var s=addDays(t,-i),a=agg(s,s);days.push({s:s,e:a.entrees,d:a.dep})}
  var mx=niceMax(Math.max(1000,Math.max.apply(null,days.map(function(x){return Math.max(x.e,x.d)}))));
  var W=380,H=210,L=40,R=6,T=10,B=26,iw=W-L-R,ih=H-T-B,bw=iw/14,g='';
  for(i=0;i<=4;i++){var y=T+ih-ih*i/4;g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+short(mx*i/4)+'</text>'}
  days.forEach(function(x,k){
    var cx=L+bw*k+bw/2,eh=ih*x.e/mx,dh=ih*x.d/mx,w=Math.min(10,bw*.4);
    g+='<rect class="be" x="'+(cx-w-1)+'" y="'+(T+ih-eh)+'" width="'+w+'" height="'+eh+'" rx="2.5"/><rect class="bd" x="'+(cx+1)+'" y="'+(T+ih-dh)+'" width="'+w+'" height="'+dh+'" rx="2.5"/>'
      +'<text class="ax'+(k===13?' today':'')+'" x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+x.s.slice(8)+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ventes et dépenses des 14 derniers jours">'+g+'</svg>'}
function actTile(act,icon,t,sub,cls){return '<button class="atile '+(cls||'')+'" data-act="'+act+'"><span class="ai">'+ic(icon,26)+'</span><b>'+t+'</b><small>'+sub+'</small></button>'}
function riskRows(R){
  return '<div class="rrows">'+R.map(function(r){
    var sc=Math.max(r.thr*2,Math.min(2,r.r*1.15));function P(x){return Math.min(100,x/sc*100)}
    var cls=r.state==='ok'?'good':r.state==='wait'?'':'bad';

     +'<div class="rb"><div class="rtrack"><i class="'+cls+'" style="width:'+P(Math.min(r.r,9.99)).toFixed(1)+'%"></i><span class="th" style="left:'+P(r.thr).toFixed(1)+'%"></span></div><small>'+F(r.a.dep)+' dépensés · '+F(r.a.entrees)+' vendus</small></div>'
     +'<div class="rv"><span class="face'+(r.state==='ok'&&r.joy==='super'?' party':'')+'">'+faceOf(r)+'</span><b class="'+cls+'">'+(r.state==='wait'?'—':pct(Math.min(r.r,9.99)))+'</b><small>'+esc(stateWord(r))+'</small></div></div>'}).join('')+'</div>'}
function riskCards(R){

  function line(r){return '<div class="rline"><span>'+esc(perLabel(r.p))+' <small>'+esc(r.pr.label)+'</small></span><b class="num">'+pct(Math.min(r.r,9.99))+'</b><small>'+F(r.a.dep)+' / '+F(r.a.entrees)+'</small></div>'}

     +'<p>'+(exp?'Un mois a passé et ça n\'a pas baissé : une nouvelle justification est demandée. ':'')+'Explique ces dépenses pour arrêter le clignotement. La zone reste en danger tant que tu es au-dessus du seuil.</p>'

  if(dg.length)out.push('<div class="alert crit danger"><div class="t"><i class="led bad"></i><span>Zone de danger</span></div><div class="rlines">'+dg.map(function(r){return line(r)+'<p class="jq">Justifié (le '+esc(fshort(ymd(new Date(r.j.at))))+') : « '+esc(r.j.text)+' ». Nouveau contrôle dans '+r.left+' jour'+(r.left>1?'s':'')+' : si ça n\'a pas baissé sous '+pct(r.j.ratio)+', l\'alerte clignote de nouveau.</p>'}).join('')+'</div></div>');

function signals(){
  var t=todayS(),d=agg(t,t),g=goalOf(d),w=agg(addDays(t,-6),t),m=M(),cr=credits(),wr=worstRisk(),R=risks(),L=[];
  L.push({n:'OBJECTIF',c:g.cls,v:g.ratio>=1?'Atteint ✓':pct(g.ratio),s:g.label});
  var pl=pcsLevel(d.pieces);L.splice(1,0,{n:'PIÈCES',c:pl.c,v:d.pieces+' / '+(S.cfg.piecesGood||10),s:pl.t});
  var anyDanger=R.some(function(r){return r.state==='flash'||r.state==='danger'}),allOk=R.every(function(r){return r.state==='ok'||r.state==='wait'})&&R.some(function(r){return r.state==='ok'});
  L.push({n:'DÉPENSES',c:wr?'bad':allOk?'good':'off',f:wr&&wr.state==='flash',v:wr?pct(Math.min(wr.r,9.99)):allOk?'Maîtrisées':'—',s:wr?(wr.state==='flash'?'Justification requise':'Zone de danger'):allOk?'Sous le seuil de '+S.cfg.seuil+' %':'Pas de données'});
  var pcs=m.arts.reduce(function(s,a){return s+Math.max(0,a.restant)},0),out=m.arts.filter(function(a){return a.restant<=0}).length,low=m.arts.filter(function(a){return a.restant>0&&a.restant<=S.cfg.stockMin}).length;

  var mg=w.entrees?w.benef/w.entrees:null;

  var old=cr.list.filter(function(l){return l.reste>0&&l.date<addDays(t,-30)}).length;
  L.push({n:'CRÉDIT',c:!cr.total?'off':cr.reste<=0?'good':old?'bad':'warn',v:cr.total?F(cr.reste):'—',s:!cr.total?'Aucun crédit':cr.reste<=0?'Tout est payé':old?'Impayé depuis plus de 30 j':'À payer'});

  return l.restant<=0?pill('','Écoulé'):pill('','En vente')}
function viewArr(){
  var m=M(),cr=credits(),inv=m.lots.reduce(function(s,l){return s+l.coutTotal},0);
  var h='<section class="sec"><div class="sec-hd"><h2>Arrivages</h2><div class="chips"><button class="btn" data-act="new-old">Ancien stock</button><button class="btn primary" data-act="new-arr">Nouvel arrivage</button></div></div>'
   +'<div class="trio"><div><span>Total investi</span><b>'+F(inv)+'</b></div><div><span>Crédit impayé</span><b class="'+(cr.reste>0?'bad':'')+'">'+F(cr.reste)+'</b></div><div><span>Crédit payé</span><b class="good">'+F(cr.paye)+'</b></div></div>'
   +'<div class="seg wide">'+[['lots','Arrivages'],['stock','Stock'],['credits','Crédits']].map(function(x){return '<button data-act="goseg" data-s="'+x[0]+'" aria-pressed="'+(S.seg===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
  if(S.seg==='stock')h+=viewStockTable();else if(S.seg==='credits')h+=viewCredits();else h+=viewLotsTable();
  return h+'</section>'}
function viewLotsTable(){
  return '<div class="fld"><label for="lq" class="sr">Chercher un arrivage</label><input id="lq" type="search" placeholder="Chercher : ARR-0001, article, facture, fournisseur…" value="'+esc(S.flt.lq||'')+'"></div><div id="lbody">'+lotsBody()+'</div>'}
function lotsBody(){
  var m=M(),q=(S.flt.lq||'').toLowerCase().trim(),L=m.lots.slice().filter(function(l){return !q||(l.no+' '+l.nom+' '+(l.nFac||'')+' '+(l.fournisseur||'')).toLowerCase().indexOf(q)>=0}).sort(function(a,b){return b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0)});
  if(q&&!L.length)return '<div class="empty">Aucun arrivage ne correspond à « '+esc(S.flt.lq)+' ».</div>';
  if(!L.length)return '<div class="empty">Aucun arrivage. Touche « Nouvel arrivage » pour enregistrer ton premier stock.</div>';
  var T={p:0,v:0,r:0,tr:0,pr:0,re:0,net:0,cr:0,cp:0,ct:0};
  var rows=L.map(function(l){
    T.p+=l.pieces;T.v+=l.vendus;T.r+=l.restant;T.tr+=l.transport;T.pr+=l.prevu;T.re+=l.marge;T.net+=l.net;T.cr+=l.reste;T.ct+=l.coutTotal;
    return '<tr data-act="lot" data-id="'+l.id+'"><td><b>'+esc(l.nom)+'</b><small>'+esc(l.no)+' · '+esc(fshort(l.date))+(l.ancien?' · ancien':'')+'</small></td><td>'+esc(l.nFac||'—')+'</td><td>'+N(l.pieces)+'</td><td>'+N(l.vendus)+'</td><td class="'+(l.restant<=0?'':'')+'"><b>'+N(l.restant)+'</b></td><td>'+F(l.prixNet)+'</td><td>'+F(l.transport)+'</td><td>'+F(l.coutUnit)+'</td><td>'+F(l.coutTotal)+'</td><td>'+F(l.prixVente)+'</td><td class="good">'+F(l.prevu)+'</td><td class="'+(l.marge>=0?'good':'bad')+'">'+F(l.marge)+'</td><td class="'+(l.net>=0?'good':'bad')+'"><b>'+F(l.net)+'</b></td><td>'+(l.credit?F(l.credit):'—')+'</td><td class="'+(l.reste>0?'bad':'')+'">'+(l.credit?F(l.reste):'—')+'</td><td>'+lotStatut(l)+'</td></tr>'}).join('');
  return '<div class="tw db"><table><thead><tr><th>Article</th><th>N° fac</th><th>Pièces</th><th>Vendues</th><th>Reste</th><th>Prix revient net</th><th>Transport montage</th><th>Revient / article</th><th>Revient total</th><th>Prix vente fixe</th><th>Bénéfice prévu</th><th>Bénéfice réalisé</th><th>Net après dépenses</th><th>Crédit</th><th>Reste à payer</th><th>État</th></tr></thead><tbody>'+rows+'</tbody>'
   +'<tfoot><tr><td>Total</td><td></td><td>'+N(T.p)+'</td><td>'+N(T.v)+'</td><td>'+N(T.r)+'</td><td></td><td>'+F(T.tr)+'</td><td></td><td>'+F(T.ct)+'</td><td></td><td>'+F(T.pr)+'</td><td>'+F(T.re)+'</td><td>'+F(T.net)+'</td><td></td><td>'+F(T.cr)+'</td><td></td></tr></tfoot></table></div>'
   +'<small>Touche une ligne pour voir le détail, payer le crédit ou annuler. Glisse le tableau sur le côté pour voir toutes les colonnes.</small>'}
function viewStockTable(){
  var A=M().arts;
  if(!A.length)return '<div class="empty">Le stock se remplit avec les arrivages et diminue avec les ventes.</div>';
  var T={r:0,v:0,s:0,vc:0,vv:0,bp:0};
  var rows=A.map(function(a){T.r+=a.recu;T.v+=a.vendu;T.s+=Math.max(0,a.restant);T.vc+=a.valeur;T.vv+=a.valVente;T.bp+=a.benefPot;
    var c=a.restant<=S.cfg.stockMin?'bad':'good';
    return '<tr><td><b>'+esc(a.nom)+'</b></td><td>'+N(a.recu)+'</td><td>'+N(a.vendu)+'</td><td class="'+c+'"><b>'+N(a.restant)+'</b></td><td>'+F(a.coutMoy)+'</td><td>'+F(a.prix)+'</td><td>'+F(a.valeur)+'</td><td>'+F(a.valVente)+'</td><td class="good">'+F(a.benefPot)+'</td></tr>'}).join('');
  return '<div class="tw"><table><thead><tr><th>Article</th><th>Reçu</th><th>Vendu</th><th>Reste</th><th>Coût moyen</th><th>Prix de vente</th><th>Valeur au coût</th><th>Valeur à la vente</th><th>Bénéfice possible</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td>Total</td><td>'+N(T.r)+'</td><td>'+N(T.v)+'</td><td>'+N(T.s)+'</td><td></td><td></td><td>'+F(T.vc)+'</td><td>'+F(T.vv)+'</td><td>'+F(T.bp)+'</td></tr></tfoot></table></div>'}
function viewCredits(){
  var cr=credits();
  if(!cr.list.length)return '<div class="empty">Aucun crédit chez un fournisseur. Quand tu en as un, tu l\'écris dans « Nouvel arrivage », cellule « Crédit chez le fournisseur ».</div>';
  var h='<div class="duo"><div class="bad"><span>Crédit impayé</span><b>'+F(cr.reste)+'</b></div><div class="good"><span>Crédit payé</span><b>'+F(cr.paye)+'</b></div></div><div class="list">';
  cr.list.forEach(function(l){
    var regs=M().regs.filter(function(r){return r.lotId===l.id}).sort(function(a,b){return a.date.localeCompare(b.date)});
    h+='<div class="item cred"><div class="main"><div class="ttl">'+esc(lotLabel(l))+'</div><div class="meta">Arrivage du '+esc(fshort(l.date))+(l.fournisseur?' · '+esc(l.fournisseur):'')+'</div></div><div class="amt">'+F(l.credit)+'<small>crédit total</small></div>'
     +'<div class="prog full"><i style="width:'+Math.min(100,l.paye/l.credit*100).toFixed(1)+'%"></i></div>'
     +'<div class="duo sm"><div class="good"><span>Payé</span><b>'+F(Math.min(l.credit,l.paye))+'</b></div><div class="'+(l.reste>0?'bad':'good')+'"><span>Reste</span><b>'+F(l.reste)+'</b></div></div>'
     +(regs.length?'<div class="regs">'+regs.map(function(r){return '<div class="reg"><span>'+esc(fshort(r.date))+' · '+esc(r.mode||'Cash')+(r.note?' · '+esc(r.note):'')+'</span><b class="num">− '+F(r.montant)+'</b><button class="link" data-act="void" data-col="reglements" data-id="'+r.id+'">Annuler</button></div>'}).join('')+'</div>':'')
     +'<div class="acts">'+(l.reste>0?'<button class="btn primary" data-act="pay" data-id="'+l.id+'">Payer ce crédit</button>':pill('good','Crédit entièrement payé'))+'<button class="link" data-act="lot" data-id="'+l.id+'">Voir l\'arrivage</button></div></div>'});
  return h+'</div>'}

/* ---------- ventes ---------- */
function saleItem(v){
  return '<div class="item"><div class="av">'+ic('sale')+'</div><div class="main"><div class="ttl">'+esc(v.article)+' <small>× '+v.qte+'</small></div><div class="meta"><span class="mono">'+esc(v.no)+'</span>'+(v.lieu?' · '+esc(v.lieu):'')+' · '+esc(v.paiement||'Cash')+(v.client?' · '+esc(v.client):'')+'</div></div>'
   +'<div class="amt">'+F(v.prix*v.qte)+'<small class="'+(v.benef>=0?'good':'bad')+'">'+sgn(v.benef)+'</small></div><div class="acts"><button class="link" data-act="edit-vente" data-id="'+v.id+'">Modifier</button><button class="link" data-act="void" data-col="ventes" data-id="'+v.id+'">Annuler cette vente</button></div>'+(v.modifs&&v.modifs.length?'<div class="meta just">Modifiée : '+esc(v.modifs[v.modifs.length-1].raison)+'</div>':'')+'</div>'}
function dayShare(day){
  var d=agg(day,day),cats=Object.keys(d.cats).map(function(k){return k+' '+N(d.cats[k])+' F'}).join(', ');
  var txt='*Ma journée du '+fdateL(day)+'*\nVendu : '+N(d.entrees)+' F ('+d.pieces+' pièce'+(d.pieces>1?'s':'')+')\nBénéfice : '+N(d.benef)+' F\nDépenses : '+N(d.dep)+' F'+(cats?' ('+cats+')':'')+'\n*Reste net : '+N(d.net)+' F*';
  return 'https://wa.me/?text='+encodeURIComponent(txt)}
function viewVentes(){
  var h='<section class="sec"><div class="sec-hd"><h2>Ventes</h2><button class="btn primary" data-act="new-vente">Nouvelle vente</button></div>'
   +'<div class="seg wide">'+[['jour','Journée'],['jours','Par jour'],['tableau','Tableau']].map(function(x){return '<button data-act="vseg" data-s="'+x[0]+'" aria-pressed="'+(S.vseg===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
  if(S.vseg==='tableau')return h+viewVentesTable()+'</section>';
  if(S.vseg==='jours')return h+viewVentesJours()+'</section>';
  var day=S.vday,t=todayS(),d=agg(day,day),L=M().sales.filter(function(v){return v.date===day}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
  h+='<div class="daynav"><button class="ib" data-act="vday" data-d="-1" aria-label="Jour précédent">'+ic('back',20)+'</button><label class="dpick"><b>'+esc(fdateL(day))+(day===t?' · aujourd\'hui':'')+'</b><small>Touche pour changer la date</small><input type="date" id="v-pick" value="'+day+'" max="'+t+'" aria-label="Choisir la date"></label><button class="ib flip" data-act="vday" data-d="1" aria-label="Jour suivant"'+(day>=t?' disabled':'')+'>'+ic('back',20)+'</button></div>';
  h+='<div class="hero"><div class="row"><span class="lab">TOTAL VENDU CE JOUR</span><span class="face'+(d.pieces>=(S.cfg.piecesGood||10)?' party':'')+'">'+pcsLevel(d.pieces).f+'</span></div><div class="big">'+F(d.entrees)+'</div><div class="lab2">'+d.pieces+' pièce'+(d.pieces>1?'s':'')+' · '+d.nb+' facture'+(d.nb>1?'s':'')+'</div>'
   +pcsBar(d.pieces)+'<div class="trio"><div><span>Bénéfice</span><b>'+F(d.benef)+'</b></div><div><span>Dépenses du jour</span><b>'+F(d.dep)+'</b></div><div><span>Reste net</span><b class="'+(d.net<0?'bad':'good')+'">'+sgn(d.net)+'</b></div></div>'
   +(Object.keys(d.cats).length?'<div class="chips">'+Object.keys(d.cats).map(function(k){return '<span class="chip">'+esc(k)+' · '+F(d.cats[k])+'</span>'}).join('')+'</div>':'<small>Aucune dépense ce jour-là.</small>')
   +'<div class="btns2"><button class="btn" data-act="new-dep" data-date="'+day+'">Ajouter mes dépenses</button><a class="btn" style="text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px" href="'+esc(dayShare(day))+'" target="_blank" rel="noopener">'+ic('share',18)+'Envoyer mon résumé</a></div></div>';
  if(!L.length)h+='<div class="empty">Aucune vente ce jour-là.'+(day===t?'<br><button class="btn primary" data-act="new-vente" style="margin-top:12px">Enregistrer une vente</button>':'')+'</div>';
  else h+='<div class="list">'+L.map(saleItem).join('')+'</div>'+dayDetails(day,L);
  return h+'</section>'}
function pcsBar(n){var g=S.cfg.piecesGood||10,mx=S.cfg.piecesMax||40,l=pcsLevel(n);return '<div class="gbar pcs"><div class="gh"><span>Pièces vendues aujourd\'hui</span><b class="'+l.c+'">'+n+' / '+mx+' <span class="face'+(n>=g?' party':'')+'">'+l.f+'</span></b></div><div class="ptrack"><i class="'+l.c+'" style="width:'+Math.min(100,n/mx*100).toFixed(1)+'%"></i><span class="th" style="left:'+(g/mx*100).toFixed(1)+'%"></span></div><small>Signe vert dès '+g+' pièces · maximum '+mx+'. '+esc(l.t)+'</small></div>'}
function dayDetails(day,L){
  var by={},pay={},best='',h='',prev=agg(addDays(day,-1),addDays(day,-1)),d=agg(day,day);
  L.forEach(function(v){var a=by[v.article]||(by[v.article]={q:0,t:0,b:0});a.q+=v.qte;a.t+=v.prix*v.qte;a.b+=v.benef;pay[v.paiement||'Cash']=(pay[v.paiement||'Cash']||0)+v.prix*v.qte});
  var ks=Object.keys(by).sort(function(x,y){return by[y].q-by[x].q});
  h+='<div class="card"><h3>Par article ce jour</h3><div class="tw"><table><thead><tr><th>Article</th><th>Pièces</th><th>Ventes</th><th>Bénéfice</th></tr></thead><tbody>'+ks.map(function(k){return '<tr><td><b>'+esc(k)+'</b></td><td>'+by[k].q+'</td><td>'+F(by[k].t)+'</td><td class="'+(by[k].b>=0?'good':'bad')+'">'+F(by[k].b)+'</td></tr>'}).join('')+'</tbody></table></div></div>';
  h+='<div class="card"><h3>Résumé du jour</h3>'+rowS('Factures',N(d.nb))+rowS('Panier moyen',F(d.nb?d.entrees/d.nb:0))+rowS('Marge',d.entrees?pct(d.benef/d.entrees):'—')+rowS('Article le plus vendu',ks.length?esc(ks[0])+' · '+by[ks[0]].q:'—')
   +Object.keys(pay).map(function(k){return rowS('Encaissé en '+esc(k),F(pay[k]))}).join('')
   +rowS('Hier',F(prev.entrees)+' · '+prev.pieces+' pcs',d.entrees>=prev.entrees?'good':'bad')+'</div>';
  return h}
function viewVentesJours(){
  var m=M(),days={};
  m.sales.forEach(function(v){days[v.date]=1});S.data.depenses.forEach(function(x){if(!x.void)days[x.date]=1});
  var K=Object.keys(days).sort().reverse();
  if(!K.length)return '<div class="empty">Les ventes de chaque jour apparaîtront ici.</div>';
  var T={nb:0,p:0,e:0,b:0,dp:0},g=S.cfg.piecesGood||10;
  var rows=K.slice(0,S.limit.ventes).map(function(k){var a=agg(k,k),l=pcsLevel(a.pieces);T.nb+=a.nb;T.p+=a.pieces;T.e+=a.entrees;T.b+=a.benef;T.dp+=a.dep;
    return '<tr data-act="vday-go" data-d="'+k+'"><td>'+esc(fshort(k))+'</td><td>'+a.nb+'</td><td><b>'+a.pieces+'</b> '+l.f+'</td><td>'+F(a.entrees)+'</td><td>'+F(a.benef)+'</td><td>'+F(a.dep)+'</td><td class="'+(a.net<0?'bad':'good')+'">'+sgn(a.net)+'</td></tr>'}).join('');
  return '<div class="tw db"><table><thead><tr><th>Date</th><th>Factures</th><th>Pièces</th><th>Ventes</th><th>Bénéfice</th><th>Dépenses</th><th>Reste net</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td>Total</td><td>'+N(T.nb)+'</td><td>'+N(T.p)+'</td><td>'+F(T.e)+'</td><td>'+F(T.b)+'</td><td>'+F(T.dp)+'</td><td>'+sgn(T.b-T.dp)+'</td></tr></tfoot></table></div><small>🎉 = '+g+' pièces ou plus dans la journée. Touche une ligne pour ouvrir ce jour.</small>'}
function viewVentesTable(){
  var pr=per(S.vper),L=M().sales.filter(function(v){return inR(v.date,pr.from,pr.to)}).sort(function(a,b){return b.date.localeCompare(a.date)||String(b.no).localeCompare(String(a.no))});
  var h='<div class="chips">'+[['mois','Ce mois'],['trimestre','Trimestre'],['annee','Année'],['tout','Tout']].map(function(x){return '<button class="chip" data-act="vper" data-p="'+x[0]+'" aria-pressed="'+(S.vper===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
  if(!L.length)return h+'<div class="empty">Aucune vente sur cette période.</div>';
  var T={q:0,t:0,b:0};
  var rows=L.slice(0,S.limit.ventes).map(function(v){return '<tr><td>'+esc(fshort(v.date))+'</td><td>'+esc(v.no)+'</td><td><b>'+esc(v.article)+'</b></td><td>'+v.qte+'</td><td>'+F(v.prix)+'</td><td>'+F(v.prix*v.qte)+'</td><td class="'+(v.benef>=0?'good':'bad')+'">'+F(v.benef)+'</td><td>'+esc(v.lieu||'—')+'</td></tr>'}).join('');
  L.forEach(function(v){T.q+=v.qte;T.t+=v.prix*v.qte;T.b+=v.benef});
  return h+'<div class="tw"><table class="firstdate"><thead><tr><th>Date</th><th>N° fac</th><th>Article</th><th>Qté</th><th>Prix vendu</th><th>Total</th><th>Bénéfice</th><th>Où vendu</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td>Total</td><td></td><td></td><td>'+N(T.q)+'</td><td></td><td>'+F(T.t)+'</td><td>'+F(T.b)+'</td><td></td></tr></tfoot></table></div>'
   +(L.length>S.limit.ventes?'<button class="btn" data-act="more" data-k="ventes">Voir plus ('+(L.length-S.limit.ventes)+')</button>':'')}

/* ---------- dépenses ---------- */
function viewDep(){
  var p=S.dper,pr=per(p),a=agg(pr.from,pr.to),thr=S.cfg.seuil/100;
  var L=S.data.depenses.filter(function(x){return !x.void&&inR(x.date,pr.from,pr.to)}).sort(function(x,y){return y.date.localeCompare(x.date)||(y.createdAt||0)-(x.createdAt||0)});
  var h='<section class="sec"><div class="sec-hd"><h2>Dépenses</h2><button class="btn primary" data-act="new-dep">Nouvelle dépense</button></div>'
   +'<div class="chips">'+[['jour','Jour'],['semaine','Semaine'],['mois','Mois'],['trimestre','Trimestre'],['tout','Tout']].map(function(x){return '<button class="chip" data-act="dper" data-p="'+x[0]+'" aria-pressed="'+(p===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
  var ok=a.entrees>0?a.dep/a.entrees<=thr:a.dep<=0;
  h+='<div class="hero"><div class="row"><span class="lab">'+esc(pr.label.toUpperCase())+'</span><span class="face">'+(a.dep<=0&&a.entrees<=0?'🙂':ok?(a.entrees>0&&a.dep/a.entrees<=thr/2?'🎉':'😊'):'😟')+'</span></div><div class="big">'+F(a.dep)+'</div><div class="lab2">dépensé sur '+F(a.entrees)+' vendus'+(a.entrees>0?' : '+pct(Math.min(9.99,a.ratio))+' (seuil '+S.cfg.seuil+' %)':'')+'</div>'
   +'<div class="trio"><div><span>Bénéfice ventes</span><b>'+F(a.benef)+'</b></div><div><span>Dépenses</span><b>'+F(a.dep)+'</b></div><div><span>Reste net</span><b class="'+(a.net<0?'bad':'good')+'">'+sgn(a.net)+'</b></div></div></div>'
   +'<div class="card"><h3>Par catégorie</h3>'+barsOf(a.cats,'Aucune dépense sur cette période.')+'</div>';
  if(!L.length)return h+'<div class="empty">Aucune dépense sur cette période.</div></section>';
  var cur='',shown=L.slice(0,S.limit.depenses);
  shown.forEach(function(x){
    if(x.date!==cur){if(cur)h+='</div>';cur=x.date;var da=agg(cur,cur);h+='<div class="day"><b>'+esc(fdate(cur))+'</b><small>dépenses '+F(da.dep)+' · reste net '+sgn(da.net)+'</small></div><div class="list">'}
    h+='<div class="item"><div class="av w">'+ic('wallet')+'</div><div class="main"><div class="ttl">'+esc(x.cat)+(x.libelle&&x.libelle!==x.cat?' <small>'+esc(x.libelle)+'</small>':'')+'</div><div class="meta"><span class="mono">'+esc(x.no)+'</span>'+(x.recu?' · reçu '+esc(x.recu):'')+(x.justif?' · justifiée':'')+'</div>'+(x.justif?'<div class="meta just">« '+esc(x.justif)+' »</div>':'')+'</div><div class="amt">'+F(x.montant)+'</div><div class="acts"><button class="link" data-act="edit-dep" data-id="'+x.id+'">Modifier</button><button class="link" data-act="void" data-col="depenses" data-id="'+x.id+'">Annuler cette dépense</button></div></div>'});
  if(cur)h+='</div>';
  if(L.length>shown.length)h+='<button class="btn" data-act="more" data-k="depenses">Voir plus ('+(L.length-shown.length)+')</button>';
  return h+'</section>'}

/* ---------- bilan ---------- */
function viewBilan(){

function saveArr(){

  function facUsed(f){return f&&lots.some(function(l){return l.nFac&&l.nFac.toLowerCase()===f.toLowerCase()})}

    if(d.tot>0&&d.tr>d.tot*S.cfg.transpPct/100&&why.length<5)return showErr('Le transport dépasse '+S.cfg.transpPct+' % du coût du lot. Écris pourquoi.')}

    if(d.oDette>0&&!val('o-due'))return showErr('Ancien stock : indique la date limite de paiement de la dette.');
    if(val('o-fac')&&facUsed(val('o-fac')))return showErr('Ancien stock : ce numéro de facture existe déjà.')}
  var jobs=[],no=nextNo(S.data.lots.concat(S.data.arrivages),'ARR-'),n=parseInt(no.slice(4),10),msg=[];

    jobs.push(put('lots',oDoc));msg.push('ancien stock '+oNo)}
  if(!isOld){
    var doc={id:uid(),no:no,date:date,nom:d.nom,key:d.key,nFac:d.fac,fournisseur:d.four,pieces:d.pieces,prixNet:d.prix,transport:d.tr,coutUnit:d.cu,coutTotal:d.tot,prixVente:d.pv,credit:d.cred,creditStatut:d.cred>0?d.cstat:'',echeance:d.cred>0&&d.cstat==='impaye'?d.due:'',ancien:false,dejaVendu:0,dejaEncaisse:0,note:why,createdAt:Date.now()+2};
    jobs.push(put('lots',doc));msg.unshift('arrivage '+no);
    if(d.cred>0){var pay=d.cstat==='paye'?d.cred:Math.min(d.ac,d.cred);
      if(pay>0)jobs.push(put('reglements',{no:nextNo(S.data.reglements,'RGL-'),date:date,lotId:doc.id,montant:pay,mode:'Cash',note:d.cstat==='paye'?'Crédit réglé à l\'arrivée':'Acompte à l\'arrivée',createdAt:Date.now()+3}))}}
  closeSheet();S.tab='arrivages';S.seg='lots';render();window.scrollTo(0,0);
  toast('Enregistré : '+msg.join(' + ')+'.');

  if(k==='arr')saveArr();else if(k==='vente'){var sb=e.submitter;saveVente()}else if(k==='dep')saveDep();else if(k==='edit')saveEdit();else if(k==='editv')saveEditVente();else if(k==='editd')saveEditDep();else if(k==='pay')savePay();else if(k==='void')saveVoid()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet){closeSheet();render()}});

/* ---------- démarrage ---------- */
var hs=(location.hash||'').replace('#','');
if(['accueil','arrivages','ventes','depenses','bilan','journal','reglages'].indexOf(hs)>=0)S.tab=hs;
lsLoad();draw();
if(STANDALONE){window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;render()});
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}}
(function(){
  if(!window.claude||!window.claude.use){S.mode='local';render();return}
  window.claude.use('downloads').then(function(d){S.dl=d;render()},function(){});
  window.claude.use('db').then(function(db){
    if(!db){S.mode='local';render();return}
    S.db=db;S.mode='cloud';S.data={lots:[],ventes:[],depenses:[],reglements:[],justifs:[],arrivages:[]};bump();render();
    COLS.forEach(function(col){
      db.collection(col).onSnapshot(function(s){S.data[col]=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});bump();render()},function(){S.mode='local';render()})});
    db.doc('reglages/main').onSnapshot(function(s){if(s.exists)S.cfg=normCfg(s.data());render()},function(){})
  },function(){S.mode='local';render()})
})();
})();
</script>
